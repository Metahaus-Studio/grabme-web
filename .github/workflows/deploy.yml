name: Deploy Next.js site to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_PASSENGER_API_URL: ${{ vars.NEXT_PUBLIC_PASSENGER_API_URL }}
          NEXT_PUBLIC_WEBSITE_INTAKE_ENABLED: ${{ vars.NEXT_PUBLIC_WEBSITE_INTAKE_ENABLED }}
          NEXT_PUBLIC_RELEASE_APPROVED: ${{ vars.NEXT_PUBLIC_RELEASE_APPROVED }}
          NEXT_PUBLIC_DRIVER_INTAKE_ENABLED: ${{ vars.NEXT_PUBLIC_DRIVER_INTAKE_ENABLED }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
